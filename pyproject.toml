[build-system]
requires = ["setuptools>=83.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-lint-py"
version = "0.2.0"
description = "Fast, local prompt-injection detection with typed findings, policy controls, and 24 built-in rules"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "promptlint"}]
keywords = ["prompt-injection", "llm", "security", "firewall", "guard", "injection-detection", "ai-security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
]
dependencies = [
    "google-re2>=0.8; platform_system != 'Windows' or python_version >= '3.11'",
    "regex>=2024.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/JulyBluesGitHub/promptlint"
Repository = "https://github.com/JulyBluesGitHub/promptlint"
Issues = "https://github.com/JulyBluesGitHub/promptlint/issues"
Changelog = "https://github.com/JulyBluesGitHub/promptlint/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "twine>=5.1",
    "types-PyYAML>=6.0",
    "types-regex>=2024.0",
]

[project.scripts]
promptlint = "promptlint.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptlint*"]

[tool.setuptools.package-data]
promptlint = ["rules.yaml", "corpora/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["promptlint"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
